name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff check
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
      - name: Example plugin contract
        run: uv run pytest -q examples/plugins/com.example.echo/tests
      - name: Alembic fresh install
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: |
          mkdir -p data
          uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker compose build bot
      - name: Build network-isolated speech worker image
        run: docker compose --profile speech build genie-tts-worker

  speech-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/genie_tts_worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install worker test dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Fake Genie and Unix socket tests
        run: uv run pytest -q
